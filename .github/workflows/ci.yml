name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck + tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # Jest suite is self-contained: no PostgreSQL, Redis, Ollama or
      # DhanHQ credentials required (db/redis degrade gracefully in tests).
      - name: Tests (Jest)
        run: npm test

      # Lint the backend with the same oxlint toolchain the frontend uses —
      # surfaces `any`-cast patterns, unused imports, and missing deps that
      # tsc --noEmit silently allows. Warnings don't fail CI today (the
      # codebase has ~15 pre-existing low-severity ones); flip to
      # `--deny-warnings` once those are cleaned up.
      - name: Lint backend (oxlint)
        run: npx --yes oxlint@latest src

      - name: Enforce engines field
        run: node -e "const p=require('./package.json'); if(!p.engines||!p.engines.node) { console.error('package.json must declare engines.node'); process.exit(1); }"

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
