# Dependabot — keeps npm deps and GitHub Actions versions current.
# Auto-opens PRs for: security advisories (immediate), minor+major bumps (weekly).
# CI gates each PR via tsc --noEmit + jest + oxlint, so a broken bump fails
# CI rather than landing silently.

version: 2

updates:
  # Backend npm deps
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: deps
      include: scope
    # Group minor/patch bumps into one PR per week to avoid PR spam.
    # Major bumps still get individual PRs (they need a human review).
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Frontend npm deps (separate package-lock.json)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: deps(frontend)
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions versions (uses: in .github/workflows/*)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
